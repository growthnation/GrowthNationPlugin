name: Release plugin zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build growthnation-plugin.zip (whole marketplace)
        run: |
          # Zip the whole MARKETPLACE — the repo root's .claude-plugin/marketplace.json
          # plus plugins/growthnation/ (plugin.json, .mcp.json, every skill). Claude
          # Desktop's "Personal plugins → +" import is marketplace-based, so the
          # archive root must hold marketplace.json + plugins/, not a bare plugin.
          zip -r "$GITHUB_WORKSPACE/growthnation-plugin.zip" \
            .claude-plugin plugins README.md LICENSE assets \
            -x '*.DS_Store' '*/.git/*'

      - name: Move "latest" tag to current commit
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Download latest plugin zip
          files: |
            growthnation-plugin.zip
          prerelease: false
          make_latest: "true"
