name: Release skill zips

# Primary install is the marketplace URL (Customize > Plugins > Personal > + >
# Add marketplace > growthnation/GrowthNationPlugin). These per-skill zips are a
# convenience for agents that take a single SKILL.md upload (e.g. Claude Chat's
# "Skills > Create Skill > Upload a skill").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build proof-audit-skill.zip
        run: |
          cd plugins/growthnation/skills/proof-audit
          zip -r "$GITHUB_WORKSPACE/proof-audit-skill.zip" SKILL.md

      - name: Build proof-meeting-prep-skill.zip
        run: |
          cd plugins/growthnation/skills/proof-meeting-prep
          zip -r "$GITHUB_WORKSPACE/proof-meeting-prep-skill.zip" SKILL.md

      - name: Build proof-email-skill.zip
        run: |
          cd plugins/growthnation/skills/proof-email
          zip -r "$GITHUB_WORKSPACE/proof-email-skill.zip" SKILL.md

      - name: Build proof-dm-skill.zip
        run: |
          cd plugins/growthnation/skills/proof-dm
          zip -r "$GITHUB_WORKSPACE/proof-dm-skill.zip" SKILL.md

      - name: Build proof-post-skill.zip
        run: |
          cd plugins/growthnation/skills/proof-post
          zip -r "$GITHUB_WORKSPACE/proof-post-skill.zip" SKILL.md

      - name: Move "latest" tag to current commit
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Download latest skill zips
          files: |
            proof-audit-skill.zip
            proof-meeting-prep-skill.zip
            proof-email-skill.zip
            proof-dm-skill.zip
            proof-post-skill.zip
          prerelease: false
          make_latest: "true"
