name: Release plugin zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build growthnation-plugin.zip (whole plugin)
        run: |
          # One zip of the entire plugin — .claude-plugin/plugin.json, .mcp.json,
          # and every skill folder — so Claude Desktop validates it as a plugin
          # instead of a bare skill. Zipping from inside the plugin dir keeps the
          # plugin structure (.claude-plugin/ etc.) at the archive root.
          cd plugins/growthnation
          zip -r "$GITHUB_WORKSPACE/growthnation-plugin.zip" . -x '*.DS_Store'

      - name: Move "latest" tag to current commit
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Download latest plugin zip
          files: |
            growthnation-plugin.zip
          prerelease: false
          make_latest: "true"
